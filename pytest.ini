[pytest]
# Chỉ quét tests/: Tai_lieu_chat_DATN_2026-11-08/, tmp/ và output/ chứa bản sao test trùng tên module.
testpaths = tests
norecursedirs = .* .venv venv build dist node_modules data output outputs tmp scratch Tai_lieu_chat_DATN_*
# Cho phép `pytest` (không qua `python -m`) import được package tests/ và mã nguồn ở thư mục gốc.
pythonpath = .
# Fixture case_data của test_pipeline_completion.py; plugin chỉ ghi evidence khi có --pipeline-evidence-dir.
addopts = -p tests.pipeline_evidence_plugin
