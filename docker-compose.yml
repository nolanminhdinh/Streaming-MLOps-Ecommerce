# Đồ án tốt nghiệp: Streaming Pipeline + MLOps cho dự báo nhu cầu TMĐT
# Toàn bộ stack: Kafka/Zookeeper, MinIO, PostgreSQL, NiFi, MLflow, FastAPI, Prometheus, Grafana.
# (Khóa `version:` đã bị Docker Compose v2 loại bỏ nên không khai báo nữa.)
#
# Cách chạy (Docker Desktop - Windows/Mac):
#   docker compose up -d
#   docker compose ps                    # kiểm tra tất cả service ở trạng thái "healthy"
#   docker compose logs -f kafka-init    # xem log tạo topic
#
# Xem hướng dẫn chi tiết tại docs/how-to-run-week2.md

services:
  # --- Nhắn tin / Streaming ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Quan trọng cho Docker Desktop: PLAINTEXT_HOST dùng để Python chạy
      # trên máy host (Windows/Mac, ngoài container) kết nối vào Kafka qua
      # localhost:29092. PLAINTEXT dùng cho giao tiếp giữa các container.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecom-net

  # Service chạy một lần để tạo sẵn Kafka Topics, tránh phải gõ lệnh thủ công.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_ORDERS:-ecom.orders.raw} --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_INVENTORY:-inventory.logs} --partitions 3 --replication-factor 1 &&
      echo 'Đã tạo xong Kafka topics:' &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - ecom-net

  # --- Data Lake ---
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console (đăng nhập bằng .env)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  # Service chạy một lần để tạo sẵn bucket lưu dữ liệu thô.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_RAW:-ecom-raw-lake} &&
      echo 'Đã tạo xong bucket ${MINIO_BUCKET_RAW:-ecom-raw-lake}'
      "
    networks:
      - ecom-net

  # --- Data Warehouse ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/ddl:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecom_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Bắt buộc cùng mạng ecom-net: thiếu khối này Postgres nằm ở mạng `default`,
    # MLflow/FastAPI/NiFi (ở ecom-net) sẽ không resolve được hostname `postgres`.
    networks:
      - ecom-net

  # --- Luồng Trực quan hóa Dữ liệu (Apache NiFi Canvas) ---
  nifi:
    image: apache/nifi:1.26.0
    container_name: nifi
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_HTTP_HOST=0.0.0.0
      - NIFI_WEB_HTTPS_PORT=
      - NIFI_JVM_HEAP_INIT=1024m
      - NIFI_JVM_HEAP_MAX=2048m
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USERNAME:-admin}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD:-adminadmin1234}
    ports:
      - "${NIFI_PORT:-8080}:8080"
    volumes:
      - ./ingestion/nifi/ecommerce_streaming_flow.xml:/opt/nifi/nifi-current/conf/templates/ecommerce_streaming_flow.xml:ro
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecom-net

  # --- MLOps (Kích hoạt Tuần 5: Experiment Tracking & Model Registry) ---
  mlflow:
    build: ./ml/mlflow
    container_name: mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Tách database riêng cho metadata MLflow, không trộn bảng MLflow với Star Schema.
      # Database `mlflow` được tạo bởi warehouse/ddl/00_create_mlflow_db.sql khi khởi tạo volume.
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_password}@postgres:5432/${MLFLOW_DB:-mlflow}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://${MINIO_BUCKET_RAW:-ecom-raw-lake}/mlflow/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks:
      - ecom-net

  # --- Model Serving (Kích hoạt Tuần 7: FastAPI Serving & Quản trị Tồn kho) ---
  fastapi:
    build: ./serving
    container_name: fastapi-serving
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      MODEL_MANIFEST_PATH: /app/data/model_manifest.json
    volumes:
      - ./data:/app/data:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # --- Monitoring (Kích hoạt Tuần 8: Prometheus & Grafana) ---
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ecom-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ecom-net

networks:
  ecom-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
