# Đồ án tốt nghiệp: Streaming Pipeline + MLOps cho dự báo nhu cầu TMĐT
# Luồng chính: Kafka/Zookeeper, MinIO, PostgreSQL, worker, MLflow, FastAPI, monitoring.
# (Khóa `version:` đã bị Docker Compose v2 loại bỏ nên không khai báo nữa.)
#
# Cách chạy (Docker Desktop - Windows/Mac):
#   docker compose up -d
#   docker compose ps                    # kiểm tra tất cả service ở trạng thái "healthy"
#   docker compose logs -f kafka-init    # xem log tạo topic
#
# Xem hướng dẫn chi tiết tại docs/how-to-run-week2.md

services:
  # --- Nhắn tin / Streaming ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Quan trọng cho Docker Desktop: PLAINTEXT_HOST dùng để Python chạy
      # trên máy host (Windows/Mac, ngoài container) kết nối vào Kafka qua
      # localhost:29092. PLAINTEXT dùng cho giao tiếp giữa các container.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-240}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecom-net

  # Service chạy một lần để tạo sẵn Kafka Topics, tránh phải gõ lệnh thủ công.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_ORDERS:-ecom.orders.raw} --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_INVENTORY:-inventory.logs} --partitions 3 --replication-factor 1 &&
      echo 'Đã tạo xong Kafka topics:' &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - ecom-net

  # --- Data Lake ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console (đăng nhập bằng .env)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  # Service chạy một lần để tạo sẵn bucket lưu dữ liệu thô.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_RAW:-ecom-raw-lake} &&
      echo 'Đã tạo xong bucket ${MINIO_BUCKET_RAW:-ecom-raw-lake}'
      "
    networks:
      - ecom-net

  # --- Data Warehouse ---
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/ddl:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecom_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Bắt buộc cùng mạng ecom-net: thiếu khối này Postgres nằm ở mạng `default`,
    # MLflow/FastAPI (ở ecom-net) sẽ không resolve được hostname `postgres`.
    networks:
      - ecom-net

  # --- MLOps (Kích hoạt Tuần 5: Experiment Tracking & Model Registry) ---
  mlflow:
    build: ./ml/mlflow
    container_name: mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Tách database riêng cho metadata MLflow, không trộn bảng MLflow với Star Schema.
      # Database `mlflow` được tạo bởi warehouse/ddl/00_create_mlflow_db.sql khi khởi tạo volume.
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_password}@postgres:5432/${MLFLOW_DB:-mlflow}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://${MINIO_BUCKET_RAW:-ecom-raw-lake}/mlflow/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  # --- Model Serving (Kích hoạt Tuần 7: FastAPI Serving & Quản trị Tồn kho) ---
  fastapi:
    build: ./serving
    container_name: fastapi-serving
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      MODEL_MANIFEST_PATH: /app/data/model_manifest.json
      MODEL_RELOAD_TOKEN: ${MODEL_RELOAD_TOKEN:-}
      MODEL_LOAD_RETRY_INITIAL_SECONDS: ${MODEL_LOAD_RETRY_INITIAL_SECONDS:-5}
      MODEL_LOAD_RETRY_MAX_SECONDS: ${MODEL_LOAD_RETRY_MAX_SECONDS:-60}
      TRAINING_STATUS_PATH: /app/data/training_status.json
      TRAINING_ALERT_WEBHOOK_URL: ${TRAINING_ALERT_WEBHOOK_URL:-}
      TRAINING_ALERT_WEBHOOK_TOKEN: ${TRAINING_ALERT_WEBHOOK_TOKEN:-}
      TRAINING_MIN_FIT_DAYS: ${TRAINING_MIN_FIT_DAYS:-14}
      HISTORY_MAX_AGE_DAYS: ${HISTORY_MAX_AGE_DAYS:-7}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # Chạy tác vụ training/retraining một lần, tách khỏi container serving chỉ đọc data.
  # Ví dụ: docker compose run --rm trainer ml/training/train_baseline.py
  trainer:
    build: ./serving
    image: streaming-mlops-ecommerce-fastapi
    profiles: ["training"]
    working_dir: /workspace
    entrypoint: ["python"]
    environment:
      PYTHONPATH: /workspace
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      TRAINING_STATUS_PATH: /workspace/data/training_status.json
      TRAINING_ALERT_WEBHOOK_URL: ${TRAINING_ALERT_WEBHOOK_URL:-}
      TRAINING_ALERT_WEBHOOK_TOKEN: ${TRAINING_ALERT_WEBHOOK_TOKEN:-}
      TRAINING_MIN_FIT_DAYS: ${TRAINING_MIN_FIT_DAYS:-14}
      SERVING_HISTORY_DAYS: ${SERVING_HISTORY_DAYS:-120}
      SERVING_PUBLIC_HISTORY_DAYS: ${SERVING_PUBLIC_HISTORY_DAYS:-240}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - ecom-net

  # --- Monitoring (Kích hoạt Tuần 8: Prometheus & Grafana) ---
  pipeline-worker:
    build: ./ingestion
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      KAFKA_BOOTSTRAP_SERVERS_HOST: kafka:9092
      MINIO_ENDPOINT_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-ecom-raw-lake}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-ecom.orders.raw}
      KAFKA_TOPIC_INVENTORY: ${KAFKA_TOPIC_INVENTORY:-inventory.logs}
      BUSINESS_TZ: ${BUSINESS_TZ:-Asia/Ho_Chi_Minh}
      CONSUMER_BATCH_TIMEOUT: ${CONSUMER_BATCH_TIMEOUT:-10}
      MINIO_SECURE: "false"
      PIPELINE_POLL_SECONDS: ${PIPELINE_POLL_SECONDS:-30}
      PIPELINE_OBJECT_BATCH_SIZE: ${PIPELINE_OBJECT_BATCH_SIZE:-100}
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/workspace/data/pipeline/status.json')); assert s['status']=='healthy' and time.time()-s['checked_at']<180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ecom-net

  # Dự báo theo lô 14 ngày cho SKU đang hoạt động khi có ngày mới được xác nhận đủ dữ liệu hoặc model
  # đổi phiên bản; gọi API serving nên dùng đúng logic và provenance. Lỗi ở đây không chặn ingestion/ETL.
  batch-forecaster:
    build: ./ingestion
    image: streaming-mlops-ecommerce-pipeline-worker:latest
    pull_policy: build
    restart: unless-stopped
    init: true
    working_dir: /workspace
    command: ["python", "scripts/run_batch_forecast.py"]
    environment:
      FORECAST_API_BASE: http://fastapi:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FORECAST_HORIZON_DAYS: ${FORECAST_HORIZON_DAYS:-14}
      FORECAST_POLL_SECONDS: ${FORECAST_POLL_SECONDS:-900}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      BUSINESS_TZ: ${BUSINESS_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./:/workspace:ro
      - ./data/forecast:/workspace/data/forecast
    depends_on:
      fastapi:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecom-net

  # Optional CSV snapshot. Failure never changes the main worker/checkpoint.
  # docker compose --profile backup run --rm csv-backup
  csv-backup:
    build: ./ingestion
    profiles: ["backup"]
    working_dir: /workspace
    command: ["python", "powerbi/export_powerbi_dataset.py", "--no-install-views"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
    volumes:
      - ./:/workspace:ro
      - ./powerbi/data:/workspace/powerbi/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecom-net

  # Local defense console. No Docker socket; bounded simulator writes via Kafka.
  demo-web:
    build: ./ingestion
    profiles: ["demo"]
    restart: unless-stopped
    init: true
    working_dir: /workspace
    command: ["python", "scripts/demo_web_server.py", "--host", "0.0.0.0", "--port", "8050"]
    environment:
      DEMO_SERVING_URL: http://fastapi:8000
      KAFKA_BOOTSTRAP_SERVERS_HOST: kafka:9092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-ecom.orders.raw}
      KAFKA_TOPIC_INVENTORY: ${KAFKA_TOPIC_INVENTORY:-inventory.logs}
      MINIO_ENDPOINT_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-ecom-raw-lake}
      MINIO_SECURE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecom_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      BUSINESS_TZ: ${BUSINESS_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./:/workspace:ro
      - ./data/demo:/workspace/data/demo
    ports:
      - "127.0.0.1:8050:8050"
    depends_on:
      pipeline-worker:
        condition: service_started
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/api/state', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ecom-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    # Giám sát phải tự chạy lại sau khi Docker khởi động lại; thiếu dòng này cảnh báo ngừng âm thầm (16/11/2026).
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ecom-net

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    container_name: ecom-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - ecom-net

  alert-receiver:
    build: ./ingestion
    image: streaming-mlops-ecommerce-pipeline-worker:latest
    pull_policy: build
    restart: unless-stopped
    working_dir: /workspace
    command: ["python", "scripts/local_alert_receiver.py"]
    environment:
      ALERT_EVENTS_PATH: /workspace/data/monitoring/alerts.jsonl
    volumes:
      - ./:/workspace:ro
      - ./data/monitoring:/workspace/data/monitoring
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9094/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ecom-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ecom-net

networks:
  ecom-net:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
